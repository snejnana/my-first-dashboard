<!DOCTYPE html>
<html>
<head>
    <title>My First Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My First Dashboard</h1>

    <p>Welcome to my first HTML project!</p>

    <h2>Customer Service</h2>

<div class="kpi-container">

    <div class="kpi-card">
        <h3>Calls Today</h3>
        <p class="kpi-value">125,430</p>
        <p class="kpi-change">+4.2%</p>
    </div>

    <div class="kpi-card">
        <h3>Average Handling Time</h3>
        <p class="kpi-value">06:42</p>
        <p class="kpi-change">-2.1%</p>
    </div>

    <div class="kpi-card">
        <h3>Customer Satisfaction</h3>
        <p class="kpi-value">91.2%</p>
        <p class="kpi-change">+1.4%</p>
    </div>

</div>

</body>
</html>
